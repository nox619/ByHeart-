<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByHeart UI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flex h-screen font-sans">
    <div class="w-64 bg-gray-100 p-5 border-r border-gray-300">
      <h1 class="text-purple-600 text-2xl font-bold">ByHeart</h1>
      <button class="bg-gray-300 py-2 px-4 rounded mb-5">
        Search Results ✖
      </button>
      <h3 class="font-semibold">Previous 7 Days</h3>
      <ul class="mt-3 space-y-2">
        <li>The quick brown fox</li>
        <li>Lorem ipsum dolor.</li>
        <li>Lazy cats nap all day.</li>
        <li>Big bears love sweet</li>
        <li>Introduction</li>
      </ul>
    </div>
    <div
      class="flex-grow bg-gray-300 flex flex-col items-center justify-center"
    >
      <h2 class="text-xl font-semibold">What do you want to Memorize?</h2>
      <div
        class="bg-white p-3 flex items-center rounded-lg shadow-md w-96 mt-4"
      >
        <input
          type="text"
          placeholder="Enter the text to memorize.."
          class="flex-grow border-none p-2 text-lg outline-none"
        />
        <button class="bg-purple-600 text-white p-3 rounded-full ml-3">
          →
        </button>
      </div>
    </div>
  </body>
</html>
